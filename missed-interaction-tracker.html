<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project Empower Helpdesk v1.1</title>
    <!-- v1.1: original UI preserved; startup recovery, pinned Babel, repair tool, version label -->
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 300: 'var(--brand-300)', 400: 'var(--brand-400)', 500: 'var(--brand-500)', 600: 'var(--brand-600)' },
                        bgmain: 'var(--bg-main)', bgsec: 'var(--bg-sec)'
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --brand-300: #a5b4fc; --brand-400: #818cf8; --brand-500: #6366f1; --brand-600: #4f46e5;
            --bg-main: #0f172a; --bg-sec: #1e293b;
        }
        body { background: var(--bg-main); background-image: radial-gradient(circle at top right, var(--bg-sec), var(--bg-main)); color: white; margin: 0; overflow-x: hidden; font-family: 'Inter', sans-serif; transition: background 0.5s ease; }
        .glass-panel { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .modern-input { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 0.85rem; border-radius: 0.75rem; width: 100%; transition: all 0.3s ease; font-size: 0.9rem; }
        .modern-input:focus { outline: none; border-color: var(--brand-500); box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05); background: rgba(0, 0, 0, 0.5); }
        .modern-input.input-error { border-color: #f43f5e; box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.1); }
        .modern-input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        
        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .scale-in { animation: scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-down { animation: slideDown 0.3s ease forwards; overflow: hidden; }
        
        /* PREMIUM DIAGNOSTICS CSS */
        .cyber-panel { background: linear-gradient(145deg, rgba(15,23,42,0.9), rgba(30,41,59,0.9)); border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 0 25px rgba(14, 165, 233, 0.15); }
        .scanner-sweep { background: conic-gradient(from 0deg, transparent 70%, rgba(56, 189, 248, 0.8) 100%); border-radius: 50%; animation: spin 0.2s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideDown { from { max-height: 0; opacity: 0; } to { max-height: 800px; opacity: 1; } }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; transition: background 0.3s; }
        ::-webkit-scrollbar-thumb:hover { background: var(--brand-500); }
        
        /* Terminal scrollbar */
        .term-scroll::-webkit-scrollbar { width: 4px; }
        .term-scroll::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen">

    <div id="root" class="min-h-screen flex items-center justify-center flex-col bg-slate-900">
        <div class="relative w-24 h-24 mb-6 flex items-center justify-center">
            <div class="absolute inset-0 border-t-4 border-brand-500 border-solid rounded-full animate-spin"></div>
            <div class="absolute inset-2 border-r-4 border-brand-400 border-solid rounded-full animate-[spin_1.5s_linear_infinite_reverse]"></div>
            <svg class="w-8 h-8 text-brand-300 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
        </div>
        <h2 class="text-2xl font-bold text-white tracking-widest uppercase animate-pulse">Project Empower</h2>
        <p class="text-slate-500 mt-2 text-sm font-mono">INITIALIZING SECURE ENVIRONMENT...</p>
    </div>

    
    <script>
        // --- v1.1 PLAIN-JS BOOT WATCHDOG ---
        (function () {
            window.__empowerPlainJsAlive = true;
            window.__empowerBabelStarted = false;
            window.__empowerReactRenderStarted = false;
            window.__empowerAppMounted = false;
            window.__empowerLastStartupError = null;
            function clearEmpowerLocalData() {
                ['omni_tickets','omni_draft','omni_theme','omni_default_site','omni_autosave_enabled'].forEach(function(k) { try { localStorage.removeItem(k); } catch(e) {} });
            }
            function repairEmpowerAppData() {
                ['omni_draft','omni_theme','omni_default_site','omni_autosave_enabled'].forEach(function(k) { try { localStorage.removeItem(k); } catch(e) {} });
                try {
                    var raw = localStorage.getItem('omni_tickets');
                    if (raw) {
                        var parsed = JSON.parse(raw);
                        if (!Array.isArray(parsed)) localStorage.removeItem('omni_tickets');
                    }
                } catch(e) { try { localStorage.removeItem('omni_tickets'); } catch(_e) {} }
            }
            function showBootRecovery(reason, errorText) {
                try {
                    var root = document.getElementById('root');
                    if (!root || window.__empowerAppMounted) return;
                    var reactLoaded = !!window.React, reactDomLoaded = !!window.ReactDOM, babelLoaded = !!window.Babel;
                    var babelScriptCount = document.querySelectorAll('script[type="text/babel"]').length;
                    var msg = String(reason || 'The app did not finish loading.');
                    var err = String(errorText || window.__empowerLastStartupError || 'No detailed error captured yet. Open F12 > Console for more details.');
                    root.className = 'min-h-screen flex items-center justify-center bg-slate-900 p-4';
                    root.innerHTML = `
                        <div class="glass-panel rounded-3xl max-w-3xl w-full p-6 sm:p-8 text-white border border-rose-500/30 shadow-2xl fade-in">
                            <div class="flex items-start gap-4">
                                <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-300 flex items-center justify-center border border-rose-500/40 flex-shrink-0">⚠</div>
                                <div class="min-w-0 flex-1">
                                    <div class="flex items-center gap-2 mb-2"><h1 class="text-2xl font-extrabold text-white">Project Empower did not start</h1><span class="text-xs bg-brand-500/20 text-brand-300 border border-brand-500/30 px-2 py-1 rounded-full font-bold">v1.1</span></div>
                                    <p class="text-slate-300 text-sm leading-relaxed mb-4">The original design is still intact. This appears because React/Babel startup did not complete after loading.</p>
                                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                                        <div class="bg-black/30 border border-slate-700 rounded-xl p-3"><p class="text-xs text-slate-500 uppercase font-bold">React</p><p class="font-mono ${reactLoaded ? 'text-emerald-400' : 'text-rose-400'}">${reactLoaded ? 'Loaded' : 'Missing'}</p></div>
                                        <div class="bg-black/30 border border-slate-700 rounded-xl p-3"><p class="text-xs text-slate-500 uppercase font-bold">ReactDOM</p><p class="font-mono ${reactDomLoaded ? 'text-emerald-400' : 'text-rose-400'}">${reactDomLoaded ? 'Loaded' : 'Missing'}</p></div>
                                        <div class="bg-black/30 border border-slate-700 rounded-xl p-3"><p class="text-xs text-slate-500 uppercase font-bold">Babel</p><p class="font-mono ${babelLoaded ? 'text-emerald-400' : 'text-rose-400'}">${babelLoaded ? 'Loaded' : 'Missing'}</p></div>
                                    </div>
                                    <div class="bg-black/40 border border-slate-700 rounded-xl p-4 mb-4">
                                        <p class="text-xs uppercase tracking-wider text-rose-300 font-bold mb-2">Startup status</p>
                                        <pre class="text-xs text-slate-300 whitespace-pre-wrap break-words max-h-52 overflow-auto">${msg}\n\n${err}\n\nBabel script tags found: ${babelScriptCount}\nBabel script ran: ${window.__empowerBabelStarted ? 'Yes' : 'No'}\nReact render started: ${window.__empowerReactRenderStarted ? 'Yes' : 'No'}\nApp mounted: ${window.__empowerAppMounted ? 'Yes' : 'No'}</pre>
                                    </div>
                                    <div class="flex flex-col sm:flex-row gap-3">
                                        <button id="empower-retry" class="bg-brand-600 hover:bg-brand-500 text-white px-5 py-2.5 rounded-xl font-bold">Retry</button>
                                        <button id="empower-repair" class="bg-sky-500/10 text-sky-300 border border-sky-500/40 hover:bg-sky-500 hover:text-white px-5 py-2.5 rounded-xl font-bold">Repair App Data & Reload</button>
                                        <button id="empower-reset" class="bg-rose-500/10 text-rose-300 border border-rose-500/40 hover:bg-rose-500 hover:text-white px-5 py-2.5 rounded-xl font-bold">Full Reset & Reload</button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    var retry = document.getElementById('empower-retry'), repair = document.getElementById('empower-repair'), reset = document.getElementById('empower-reset');
                    if (retry) retry.onclick = function(){ location.reload(); };
                    if (repair) repair.onclick = function(){ repairEmpowerAppData(); location.reload(); };
                    if (reset) reset.onclick = function(){ clearEmpowerLocalData(); location.reload(); };
                } catch(e) { console.error('Boot recovery failed', e); }
            }
            window.__empowerShowBootRecovery = showBootRecovery;
            window.__empowerRepairAppData = repairEmpowerAppData;
            window.addEventListener('error', function(event) {
                window.__empowerLastStartupError = (event && (event.message || (event.error && event.error.stack))) || 'Unknown window error';
                if (!window.__empowerAppMounted) setTimeout(function(){ showBootRecovery('A JavaScript error occurred during startup.', window.__empowerLastStartupError); }, 0);
            });
            window.addEventListener('unhandledrejection', function(event) {
                window.__empowerLastStartupError = (event && event.reason && (event.reason.stack || event.reason.message || event.reason.toString())) || 'Unhandled promise rejection';
                if (!window.__empowerAppMounted) setTimeout(function(){ showBootRecovery('An unhandled promise rejection occurred during startup.', window.__empowerLastStartupError); }, 0);
            });
            setTimeout(function() {
                var root = document.getElementById('root');
                if (!window.__empowerAppMounted && root && root.textContent && root.textContent.indexOf('INITIALIZING SECURE ENVIRONMENT') !== -1) showBootRecovery('Startup timed out after 8 seconds. The loader is still visible.');
            }, 8000);
        })();
    </script>
<script type="text/babel" data-presets="env,react">
        window.__empowerBabelStarted = true;
        const { useState, useEffect, useRef, Fragment } = React;
        const APP_VERSION = '1.1';

        // --- v1.1 STARTUP RESILIENCE PATCH ---
        function showStartupError(error, details = '') {
            try {
                if (window.__empowerShowBootRecovery) {
                    window.__empowerShowBootRecovery('React/Babel reached the app code, but rendering failed.', (error && (error.stack || error.message || error.toString())) || details || 'Unknown render error');
                    return;
                }
            } catch(e) { console.error(e); }
        }
        function sanitizeTicket(t, index = 0) {
            const now = new Date().toLocaleString();
            const safe = (v, fallback = 'N/A') => (v === undefined || v === null || v === '') ? fallback : String(v);
            return { id: safe(t && t.id, `RECOVERED-${index + 1}`), date: safe(t && t.date, now), category: safe(t && t.category, 'Recovered Data'), summary: safe(t && t.summary, 'Recovered ticket with missing summary.'), site: safe(t && t.site, 'N/A'), queue: safe(t && t.queue, 'N/A'), ds: safe(t && t.ds, 'N/A'), severity: safe(t && t.severity, 'N/A'), mainIssue: safe(t && t.mainIssue, 'N/A'), subIssue: safe(t && t.subIssue, 'N/A'), leader: safe(t && t.leader, 'N/A') };
        }
        function loadSafeTickets() {
            try {
                const raw = safeGetItem('omni_tickets', '[]');
                const parsed = JSON.parse(raw || '[]');
                if (!Array.isArray(parsed)) return [];
                const cleaned = parsed.map((t, i) => sanitizeTicket(t, i));
                if (JSON.stringify(cleaned) !== JSON.stringify(parsed)) safeSetItem('omni_tickets', JSON.stringify(cleaned));
                return cleaned;
            } catch (e) {
                console.warn('Corrupted omni_tickets detected. Backing it up and starting clean.', e);
                try { safeSetItem('omni_tickets_corrupt_backup_' + Date.now(), safeGetItem('omni_tickets', '')); } catch(_e) {}
                safeRemoveItem('omni_tickets');
                return [];
            }
        }
        function repairAppData() {
            // Repair mode clears settings/draft and validates tickets. It is safer than Clear Local Data.
            ['omni_draft','omni_theme','omni_default_site','omni_autosave_enabled'].forEach(k => safeRemoveItem(k));
            loadSafeTickets();
            alert('Repair complete. The app will reload now.');
            location.reload();
        }
        class StartupErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, info) { console.error('React render error:', error, info); }
            render() {
                if (this.state.hasError) {
                    const msg = (this.state.error && (this.state.error.message || this.state.error.toString())) || 'Unknown render error';
                    return (<div className="min-h-screen flex items-center justify-center p-4 bg-slate-900"><div className="glass-panel rounded-3xl max-w-2xl w-full p-6 sm:p-8 border border-rose-500/30 shadow-2xl fade-in"><h1 className="text-2xl font-extrabold text-white mb-3">Project Empower hit a render/data issue</h1><p className="text-slate-300 text-sm mb-4">Your original UI is preserved. This usually means old saved browser data is broken after the update.</p><pre className="bg-black/40 border border-slate-700 rounded-xl p-4 text-xs text-rose-200 whitespace-pre-wrap break-words mb-4">{msg}</pre><div className="flex flex-col sm:flex-row gap-3"><button onClick={() => location.reload()} className="bg-brand-600 hover:bg-brand-500 text-white px-5 py-2.5 rounded-xl font-bold">Retry</button><button onClick={repairAppData} className="bg-sky-500/10 text-sky-300 border border-sky-500/40 hover:bg-sky-500 hover:text-white px-5 py-2.5 rounded-xl font-bold">Repair App Data & Reload</button><button onClick={() => { ['omni_tickets','omni_draft','omni_theme','omni_default_site','omni_autosave_enabled'].forEach(k => safeRemoveItem(k)); location.reload(); }} className="bg-rose-500/10 text-rose-300 border border-rose-500/40 hover:bg-rose-500 hover:text-white px-5 py-2.5 rounded-xl font-bold">Full Reset</button></div></div></div>);
                }
                return this.props.children;
            }
        }

        function safeGetItem(key, defaultValue) { try { return localStorage.getItem(key) || defaultValue; } catch (e) { return defaultValue; } }
        function safeSetItem(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
        function safeRemoveItem(key) { try { localStorage.removeItem(key); } catch (e) {} }
        function getOrSetMachineId() {
            let id = safeGetItem('logger_machine_id', null);
            if (!id) { id = Math.random().toString(36).substring(2, 6).toUpperCase(); safeSetItem('logger_machine_id', id); }
            return id;
        }

        const THEMES = [
            { id: 'midnight', name: 'Midnight Pro', vars: { '--brand-300': '#a5b4fc', '--brand-400': '#818cf8', '--brand-500': '#6366f1', '--brand-600': '#4f46e5', '--bg-main': '#0f172a', '--bg-sec': '#1e293b' } },
            { id: 'neon', name: 'Neon City', vars: { '--brand-300': '#f0abfc', '--brand-400': '#e879f9', '--brand-500': '#d946ef', '--brand-600': '#c026d3', '--bg-main': '#1a0b2e', '--bg-sec': '#3b0764' } },
            { id: 'matrix', name: 'Matrix Green', vars: { '--brand-300': '#6ee7b7', '--brand-400': '#34d399', '--brand-500': '#10b981', '--brand-600': '#059669', '--bg-main': '#022c22', '--bg-sec': '#064e3b' } },
            { id: 'crimson', name: 'Crimson Forge', vars: { '--brand-300': '#fda4af', '--brand-400': '#fb7185', '--brand-500': '#f43f5e', '--brand-600': '#e11d48', '--bg-main': '#2c061f', '--bg-sec': '#4c0519' } },
            { id: 'abyss', name: 'Deep Abyss', vars: { '--brand-300': '#7dd3fc', '--brand-400': '#38bdf8', '--brand-500': '#0ea5e9', '--brand-600': '#0284c7', '--bg-main': '#082f49', '--bg-sec': '#0c4a6e' } }
        ];

        function App() {
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [tickets, setTickets] = useState([]);
            
            const [currentTheme, setCurrentTheme] = useState('midnight');
            const [defaultSite, setDefaultSite] = useState('Manila');
            const [autoSaveEnabled, setAutoSaveEnabled] = useState(true);

            const [expandedTicketId, setExpandedTicketId] = useState(null);
            const [expandedSummaryId, setExpandedSummaryId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterCategory, setFilterCategory] = useState('All');
            useEffect(() => {
                window.__empowerAppMounted = true;
                const root = document.getElementById('root');
                if (root && root.classList.contains('bg-slate-900')) root.classList.remove('bg-slate-900');
            }, []);

            // --- PWA INJECTION ---
            useEffect(() => {
                try {
                    const manifest = {
                        "name": "Project Empower Helpdesk",
                        "short_name": "EmpowerDesk",
                        "start_url": ".",
                        "display": "standalone",
                        "background_color": "#0f172a",
                        "theme_color": "#6366f1",
                        "icons": [{
                            "src": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'%3E%3Cpath d='M12 2L2 22h20L12 2z'/%3E%3C/svg%3E",
                            "sizes": "192x192",
                            "type": "image/svg+xml"
                        }]
                    };
                    const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
                    const link = document.createElement('link');
                    link.rel = 'manifest';
                    link.href = URL.createObjectURL(manifestBlob);
                    document.head.appendChild(link);

                    const swCode = `self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('fetch', e => {});`;
                    const swBlob = new Blob([swCode], {type: 'application/javascript'});
                    if ('serviceWorker' in navigator) {
                        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
                    }
                } catch(e) {}
            }, []);

            useEffect(() => {
                try {
                    const savedTix = loadSafeTickets();
                    setTickets(savedTix);
                    
                    setDefaultSite(safeGetItem('omni_default_site', 'Manila'));
                    setAutoSaveEnabled(safeGetItem('omni_autosave_enabled', 'true') === 'true');
                    
                    const savedTheme = safeGetItem('omni_theme', 'midnight');
                    applyTheme(savedTheme);
                } catch (e) {}
            }, []);

            const applyTheme = (themeId) => {
                const theme = THEMES.find(t => t.id === themeId) || THEMES[0];
                Object.keys(theme.vars).forEach(key => document.documentElement.style.setProperty(key, theme.vars[key]));
                setCurrentTheme(themeId);
                safeSetItem('omni_theme', themeId);
            };

            const addTicketToHistory = (ticket) => {
                const updated = [sanitizeTicket(ticket), ...tickets.map((t, i) => sanitizeTicket(t, i))];
                setTickets(updated);
                safeSetItem('omni_tickets', JSON.stringify(updated));
            };

            const clearTickets = () => {
                setTickets([]);
                safeRemoveItem('omni_tickets');
                safeRemoveItem('omni_draft');
            };

            const toggleSummary = (id, e) => {
                e.stopPropagation();
                setExpandedSummaryId(expandedSummaryId === id ? null : id);
            };

            const filteredTickets = tickets.map((t, i) => sanitizeTicket(t, i)).filter(t => {
                const q = searchTerm.toLowerCase();
                const matchesSearch = String(t.id || '').toLowerCase().includes(q) || 
                                      String(t.summary || '').toLowerCase().includes(q) ||
                                      String(t.ds || '').toLowerCase().includes(q);
                const matchesCategory = filterCategory === 'All' || t.category === filterCategory;
                return matchesSearch && matchesCategory;
            });

            return (
                <Fragment>
                    <div className="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 fade-in">
                        <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b border-slate-700/50 pb-6 gap-4">
                            <div className="w-full md:w-auto">
                                <h1 className="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-white break-words">
                                    Project E System Issue Tracker 1.2
                                </h1>
                                <p className="text-slate-400 mt-1 text-sm tracking-wide">Enterprise Issue Tracking <span className="ml-2 text-[10px] bg-brand-500/10 text-brand-300 border border-brand-500/30 px-2 py-0.5 rounded-full font-bold align-middle">v{APP_VERSION}</span></p>
                            </div>
                            <div className="flex gap-3 w-full md:w-auto">
                                <button onClick={() => setIsSettingsOpen(true)} className="bg-slate-800/80 hover:bg-slate-700 text-slate-300 p-2.5 rounded-full shadow-lg transition-all border border-slate-600/50 flex-shrink-0" title="Settings">
                                    <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                </button>
                                <button onClick={() => setIsFormOpen(true)} className="flex-1 md:flex-none bg-brand-600 hover:bg-brand-500 text-white px-6 py-2.5 rounded-full font-semibold shadow-lg shadow-brand-500/20 transition-all flex items-center justify-center gap-2 border border-brand-400/30">
                                    <span>+ Create Ticket</span>
                                </button>
                            </div>
                        </header>

                        <div className="mb-6 flex flex-col sm:flex-row gap-4 fade-in">
                            <div className="relative flex-1">
                                <svg className="absolute left-3 top-3 w-5 h-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>

                setTestPhase('running');

                setLogs(["> Initializing network hardware protocols...", "> Verifying local interface..."]);

                const addLog = (msg) => setLogs(p => [...p, msg]);

                await new Promise(r => setTimeout(r, 800));

                if (!navigator.onLine) {
                    addLog("> CRITICAL: Local network interface is OFFLINE.");
                    addLog("> Diagnostics aborted. Check ethernet or Wi-Fi connection.");
                    setTestPhase('done');
                    return;
                }
                addLog("> Local interface: ONLINE");

                if (navigator.connection && navigator.connection.effectiveType) {
                    const type = navigator.connection.effectiveType.toUpperCase();
                    addLog(`> Browser Network API detected routing type: ${type}`);
                    setConnType(type);
                }

                addLog("> Pinging external edge node (1.1.1.1)...");
                try {
                    const start = performance.now();
                    await fetch('https://1.1.1.1/cdn-cgi/trace', { mode: 'no-cors', cache: 'no-store' });
                    const pTime = Math.round(performance.now() - start);
                    setPing(pTime);
                    addLog(`> Edge node replied in ${pTime}ms`);

                    addLog("> ERR: Edge node ping timeout or blocked.");

                await new Promise(r => setTimeout(r, 400));
                
                addLog("> Requesting test payload from CDN...");
                const dlStart = performance.now();
                const img = new Image();
                
                img.onload = () => {
                    const dlEnd = performance.now();
                    const duration = (dlEnd - dlStart) / 1000; 
                    const estimatedBytes = 2500000; 
                    const mbps = ((estimatedBytes * 8) / (1024 * 1024)) / duration;
                    
                    setDownload(mbps.toFixed(1));
                    addLog(`> Payload received successfully in ${duration.toFixed(2)}s`);
                    addLog(`> Network bandwidth calculated at ${mbps.toFixed(1)} Mbps`);

                    addLog("> --- DIAGNOSTICS HALTED ---");
                    setTestPhase('done');

                                        <button onClick={() => setCategory('Program Feedback & Requests')} className="p-4 sm:p-5 rounded-2xl bg-gradient-to-br from-purple-600/80 to-pink-800/80 hover:from-purple-500 hover:to-pink-700 transition-all shadow-lg text-left border border-purple-400/30 flex flex-col items-center text-center">
                                            <svg className="w-7 h-7 sm:w-8 sm:h-8 mb-2 text-purple-200" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z" /></svg>
                                            <span className="block font-bold text-base sm:text-lg text-white mb-1">Feedback & Requests</span><span className="text-purple-200 text-xs">Program events, game ideas, seating, general feedback.</span>
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-6 fade-in w-full pb-8">
                                    <div className="flex flex-wrap items-center justify-between mb-2 gap-2 pr-10 sm:pr-12">
                                        <h3 className="text-lg sm:text-xl font-bold text-white flex items-center gap-2 sm:gap-3">
                                            <button onClick={() => { setCategory(null); safeRemoveItem('omni_draft'); setHasDraft(false); }} className="text-slate-400 hover:text-white transition-colors p-1.5 bg-black/30 rounded-lg hover:bg-black/50">
                                                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                                            </button>
                                            <span className="border-l-2 border-brand-500 pl-2 sm:pl-3">{category} Form</span>
                                        </h3>
                                        <div className="flex items-center gap-3">
                                            <span className="text-[10px] font-mono text-slate-500 flex items-center gap-1 border border-slate-700 bg-black/30 px-2 py-1 rounded">
                                                {autoNetStats.includes('Online') ? <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> : <span className="w-1.5 h-1.5 rounded-full bg-slate-500"></span>}
                                                {autoNetStats}
                                            </span>
                                            {autoSave && <span className="text-xs font-mono text-slate-500 flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Auto-Saving</span>}
                                        </div>
                                    </div>

                                    {/* --- TICKET DEFLECTION / QUICK FIXES --- */}
                                    {(category === 'System Issue' && sysType === 'Call Connection') && (
                                        <div className="bg-brand-500/10 border border-brand-500/30 p-4 rounded-xl fade-in flex gap-4 items-start">
                                            <div className="text-2xl">💡</div>
                                            <div>
                                                <h4 className="text-sm font-bold text-brand-300">Quick Fixes (Try these first)</h4>
                                                <p className="text-xs text-slate-300 mt-1 leading-relaxed">Before submitting, please attempt to: <b>1.</b> Hard refresh the platform (Ctrl+F5). <b>2.</b> Clear your browser cache. <b>3.</b> Re-plug your headset USB connector.</p>
                                            </div>
                                        </div>
                                    )}
                                    {category === 'Hardware Issue' && (
                                        <div className="bg-orange-500/10 border border-orange-500/30 p-4 rounded-xl fade-in flex gap-4 items-start">
                                            <div className="text-2xl">🔌</div>
                                            <div>
                                                <h4 className="text-sm font-bold text-orange-300">Hardware Check</h4>
                                                <p className="text-xs text-slate-300 mt-1">Please ensure all cables are securely plugged into your Thin Client and monitor before requesting a replacement.</p>
                                            </div>
                                        </div>
                                    )}

                                    {/* --- 1. DYNAMIC PRIMARY QUESTION AREA --- */}
                                    <div className="fade-in bg-black/20 p-4 sm:p-5 rounded-xl border border-slate-700/50 shadow-inner">
                                        {category === 'System Issue' && (
                                            <div className="space-y-4">
                                                <label className="block text-sm font-bold text-brand-300 pl-1">Specific System Issue <span className="text-rose-400">*</span></label>
                                                <select value={sysType} onChange={e => setSysType(e.target.value)} className="modern-input">{mainIssueOptions.map(o => <option key={o}>{o}</option>)}</select>
                                                {sysType === 'Call Connection' && <select value={sysSubType} onChange={e => setSysSubType(e.target.value)} className="modern-input mt-3 text-sm">{callSubOptions.map(o => <option key={o}>{o}</option>)}</select>}
                                            </div>
                                        )}
                                        {category === 'Hardware Issue' && (
                                            <div className="space-y-4">
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="block text-sm font-bold text-orange-300 pl-1 mb-2">What equipment is broken? <span className="text-rose-400">*</span></label>
                                                        <select value={hwType} onChange={e => setHwType(e.target.value)} className="modern-input border-orange-500/30">
                                                            <option>TLK (Audio/Mute Connector)</option><option>Headset (Mic/Earpiece)</option><option>PC / Thin Client Unit</option><option>Monitor / Screen</option><option>Keyboard or Mouse</option><option>Other</option>
                                                        </select>
                                                        {hwType === 'Other' && <input type="text" value={hwCustomType} onChange={e => setHwCustomType(e.target.value)} placeholder="Specify broken hardware..." className="modern-input mt-3" />}
                                                    </div>
                                                    <div>
                                                        <label className="block text-sm font-bold text-orange-300 pl-1 mb-2">Location Type <span className="text-rose-400">*</span></label>
                                                        <select value={hwLocationType} onChange={e => { setHwLocationType(e.target.value); setSeatError(''); setHwSeat(''); }} className="modern-input border-orange-500/30">
                                                            <option>Production Floor</option>
                                                            <option>Training Room</option>
                                                            <option>Coaching Room</option>
                                                        </select>
                                                    </div>
                                                    <div className="md:col-span-2">
                                                        <label className="block text-sm font-bold text-orange-300 pl-1 mb-2">
                                                            {hwLocationType === 'Production Floor' ? 'Seat Number' : (hwLocationType === 'Training Room' ? 'Training Room & Seat' : 'Coaching Room Number')} <span className="text-rose-400">*</span>
                                                        </label>
                                                        <input type="text" value={hwSeat} onChange={handleSeatChange} 
                                                            placeholder={
                                                                hwLocationType === 'Production Floor' ? 'e.g. 1A, 35G, 14F' : 
                                                                (hwLocationType === 'Training Room' ? 'e.g. Training Room 4, Seat 12' : 'e.g. Coaching Room B')
                                                            } 
                                                            className={`modern-input ${hwLocationType === 'Production Floor' ? 'uppercase' : ''} transition-all ${seatError ? 'input-error' : ''}`} 
                                                            maxLength={hwLocationType === 'Production Floor' ? 4 : 50} 
                                                        />
                                                        {seatError ? (
                                                            <p className="text-xs text-rose-500 mt-2 pl-1 font-bold fade-in">{seatError}</p>
                                                        ) : (
                                                            <p className="text-xs text-slate-400 mt-2 pl-1">
                                                                {hwLocationType === 'Production Floor' ? 'Format required: Numbers + letter (A-G).' : 
                                                                (hwLocationType === 'Training Room' ? 'Please include what training room and seat number if applicable.' : 'Please enter the coaching room number.')}
                                                            </p>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                        {category === 'Access Request' && (
                                            <div className="space-y-4">
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="block text-xs font-bold text-amber-300 mb-1.5 uppercase pl-1">System / Application <span className="text-rose-400">*</span></label>
                                                        <select value={accSystem} onChange={e => setAccSystem(e.target.value)} className="modern-input">
                                                            <option>NT Login</option>
                                                            <option>MS365</option>
                                                            <option>Omni Platform</option>
                                                            <option>Email / Outlook</option>
                                                            <option>Unable to Access App/Site</option>
                                                        </select>
                                                        
                                                        {accSystem === 'Unable to Access App/Site' && (
                                                            <div className="mt-3 fade-in">
                                                                <label className="block text-xs font-bold text-amber-200 mb-1.5 pl-1">Which App / Site?</label>
                                                                <select value={accApp} onChange={e => setAccApp(e.target.value)} className="modern-input text-sm">
                                                                    <option>MS Teams</option>
                                                                    <option>Salesforce</option>
                                                                    <option>Observe.ai</option>
                                                                    <option>Aspect</option>
                                                                    <option>E3 Portal</option>
                                                                    <option>Other</option>
                                                                </select>
                                                                {accApp === 'Other' && <input type="text" value={accCustomApp} onChange={e => setAccCustomApp(e.target.value)} placeholder="Specify App or URL..." className="modern-input mt-2" />}
                                                            </div>
                                                        )}
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-bold text-amber-300 mb-1.5 uppercase pl-1">Affected Username/Email <span className="text-rose-400">*</span></label>
                                                        <input type="text" value={accUser} onChange={e => setAccUser(e.target.value)} className="modern-input" placeholder="e.g. jdoe@company.com" />
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                        {category === 'WFM/Schedule' && (
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div><label className="block text-sm font-bold text-emerald-300 mb-2 pl-1">Dispute Type <span className="text-rose-400">*</span></label><select value={wfmType} onChange={e => setWfmType(e.target.value)} className="modern-input"><option>Missing Stamp / Segment</option><option>Aspect Schedule Mismatch</option><option>Aux / Wrap-up Correction</option><option>VTO Logging</option><option>Other</option></select>{wfmType === 'Other' && <input type="text" value={wfmCustomType} onChange={e => setWfmCustomType(e.target.value)} placeholder="Specify issue..." className="modern-input mt-3 fade-in" />}</div>
                                                <div><label className="block text-sm font-bold text-emerald-300 mb-2 pl-1">Date in Question <span className="text-rose-400">*</span></label><input type="date" value={wfmDate} onChange={e => setWfmDate(e.target.value)} className="modern-input" /></div>
                                            </div>
                                        )}
                                        {category === 'Missed Interaction' && (
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div className="md:col-span-2">
                                                    <label className="block text-sm font-bold text-cyan-300 mb-2 pl-1">Reason for Missed Interaction <span className="text-rose-400">*</span></label>
                                                    <select value={miReason} onChange={e => setMiReason(e.target.value)} className="modern-input"><option>On another call</option><option>Break/Lunch overlap</option><option>Call did not Push Through</option><option>Other</option></select>
                                                    {miReason === 'Other' && <input type="text" value={miCustomReason} onChange={e => setMiCustomReason(e.target.value)} placeholder="Specify custom reason..." className="modern-input mt-3 fade-in" />}
                                                </div>
                                                <div className="md:col-span-2">
                                                    <label className="block text-sm font-bold text-cyan-300 mb-2 pl-1">Have you troubleshooted? <span className="text-rose-400">*</span></label>
                                                    <select value={miAction} onChange={e => setMiAction(e.target.value)} className="modern-input"><option>Yes</option><option>No</option></select>
                                                    
                                                    {miAction === 'Yes' && (
                                                        <div className="mt-2 pl-1 fade-in">
                                                            <p className="text-xs text-slate-400 italic">
                                                                * Expected Steps: Cleared cache, refreshed Omni platform, and restarted your PC.
                                                            </p>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        )}
                                        {category === 'Program Feedback & Requests' && (
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div className="md:col-span-2">
                                                    <label className="block text-sm font-bold text-purple-300 pl-1 mb-2">Feedback Type <span className="text-rose-400">*</span></label>
                                                    <select value={feedbackType} onChange={e => setFeedbackType(e.target.value)} className="modern-input border-purple-500/30">
                                                        <option>Program Event Idea</option><option>Game / Activity</option><option>Seating Request</option><option>General Feedback</option><option>Other</option>
                                                    </select>
                                                    {feedbackType === 'Other' && <input type="text" value={feedbackCustomType} onChange={e => setFeedbackCustomType(e.target.value)} placeholder="Specify type..." className="modern-input mt-3 fade-in" />}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* --- 2. UNIVERSAL DETAILS AREA --- */}
                                    <div className="fade-in space-y-4">
                                        <label className="block text-sm font-bold text-slate-300 pl-1">2. Core Details</label>
                                        
                                        {/* THE GRID: items-end forces everything to align beautifully at the bottom */}
                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 bg-black/20 p-4 sm:p-5 rounded-xl border border-slate-700/30 items-end">
                                            
                                            <div className="w-full">
                                                <label className="block text-xs font-bold text-slate-400 mb-2 uppercase pl-1">Site</label>
                                                <select value={site} onChange={e => setSite(e.target.value)} className="modern-input"><option>Manila</option><option>Cebu</option></select>
                                            </div>
                                            
                                            {needsQueue && (
                                                <div className="w-full fade-in">
                                                    <label className="block text-xs font-bold text-slate-400 mb-2 uppercase pl-1">Queue</label>
                                                    <select value={queue} onChange={e => setQueue(e.target.value)} className="modern-input"><option>Inbound</option><option>Outbound</option><option>Email</option></select>
                                                </div>
                                            )}

                                            {needsDS && (
                                                <div className="w-full fade-in">
                                                    <label className="block text-xs font-bold text-slate-400 mb-2 uppercase pl-1">DS Number</label>
                                                    <input type="text" value={ds} onChange={e => {
                                                        let val = e.target.value.toUpperCase().replace(/\s/g, '');
                                                        setDs(val);
                                                    }} className="modern-input" placeholder="e.g. DS-12345" />
                                                </div>
                                            )}

                                            {needsSeverity && (
                                                <div className="w-full fade-in">
                                                    <label className="block text-xs font-bold text-slate-400 mb-2 uppercase pl-1">Severity</label>
                                                    <select value={severity} onChange={e => setSeverity(e.target.value)} className="modern-input"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select>
                                                </div>
                                            )}
                                            
                                            {category === 'System Issue' && sysType === 'Call Connection' && (
                                                <div className="w-full fade-in">
                                                    <label className="block text-xs font-bold text-slate-400 mb-2 uppercase pl-1">Call Status</label>
                                                    <select value={sysCallStatus} onChange={e => setSysCallStatus(e.target.value)} className="modern-input"><option>Call Completed</option><option>Call Disconnected</option></select>
                                                </div>
                                            )}

                                            {category === 'Hardware Issue' && (
                                                <div className="w-full sm:col-span-2 md:col-span-1 lg:col-span-2 fade-in">
                                                    <label className="block text-xs font-bold text-slate-400 mb-2 uppercase pl-1">Asset Tag / PC Name</label>
                                                    <input type="text" value={hwAsset} onChange={e => setHwAsset(e.target.value)} className="modern-input" placeholder="e.g. MNL-WS-1042" />
                                                </div>
                                            )}

                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 fade-in">
                                            <div className="md:col-span-2">
                                                <label className="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider pl-1">
                                                    Summary & Details {category !== 'Missed Interaction' ? <span className="text-rose-400">*</span> : <span className="text-slate-500 normal-case tracking-normal ml-1 font-medium">(Optional)</span>}
                                                </label>
                                                <textarea value={summary} onChange={e => setSummary(e.target.value)} rows="3" className="modern-input resize-none" placeholder="Describe the issue or suggestion..."></textarea>
                                            </div>
                                            
                                            {category !== 'Program Feedback & Requests' && (
                                                <div className="md:col-span-2">
                                                    <label className="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider pl-1">Reported To (Leader/SME)</label>
                                                    <input type="text" value={leader} onChange={e => setLeader(e.target.value)} className="modern-input" placeholder="e.g. Jane Doe" />
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {/* --- 3. ATTACHMENT AREA (MULTI-IMAGE GALLERY) --- */}
                                    <div>
                                        <div className="flex justify-between items-end mb-2 pl-1">
                                            <label className="block text-sm font-bold text-slate-200">
                                                3. Attachments {category === 'Missed Interaction' ? <span className="text-rose-400">*</span> : <span className="text-slate-500 text-xs font-medium ml-1">(Optional)</span>}
                                            </label>
                                            <span className="text-xs font-bold text-slate-500">{images.length} / 3 Uploaded</span>
                                        </div>
                                        
                                        {images.length === 0 ? (
                                            <div className="border-2 border-dashed border-slate-600/50 hover:border-brand-400 bg-black/20 rounded-2xl p-6 sm:p-8 text-center transition-all duration-300 flex flex-col items-center justify-center gap-4 group">
                                                <div className="text-slate-400 font-medium flex flex-col items-center justify-center gap-2">
                                                    <svg className="w-6 h-6 sm:w-8 sm:h-8 text-slate-500 group-hover:text-brand-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                                                    <span className="text-sm sm:text-base">Click anywhere on screen & press <kbd className="bg-slate-700/80 px-2 py-1 rounded-md text-white text-xs mx-1 font-mono shadow-sm">Ctrl+V</kbd> to paste</span>
                                                </div>
                                                <div className="text-slate-500 text-xs uppercase tracking-wider font-bold">OR</div>
                                                <button 
                                                    onClick={captureScreen} 
                                                    disabled={isCapturing}
                                                    className="bg-brand-600/20 hover:bg-brand-600/40 text-brand-300 border border-brand-500/50 px-4 py-2.5 rounded-lg font-bold text-sm transition-all flex items-center gap-2"
                                                >
                                                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                                    {isCapturing ? 'Capturing...' : 'Capture Screen / Tab'}
                                                </button>
                                            </div>
                                        ) : (
                                            <div className="border border-brand-500/30 bg-brand-900/10 rounded-2xl p-4 transition-all duration-300 fade-in">
                                                <div className="flex flex-col sm:flex-row gap-4 overflow-x-auto pb-2 items-center">
                                                    {images.map((img, idx) => (
                                                        <div key={idx} className="relative w-full sm:w-48 h-32 flex-shrink-0 bg-black/50 rounded-xl border border-slate-700/50 group">
                                                            <img 
                                                                src={img.url} 
                                                                alt={`Attachment ${idx + 1}`} 
                                                                className="w-full h-full object-cover rounded-xl cursor-pointer hover:opacity-50 transition-opacity"
                                                                onClick={() => setExpandedImage(img.url)}
                                                            />
                                                            <button 
                                                                onClick={() => removeImage(idx)} 
                                                                className="absolute -top-2 -right-2 bg-rose-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold shadow-lg hover:bg-rose-500 transition-colors z-10"
                                                            >✕</button>
                                                        </div>
                                                    ))}
                                                    
                                                    {images.length < 3 && (
                                                        <div className="w-full sm:w-48 h-32 flex-shrink-0 border-2 border-dashed border-slate-600/50 hover:border-brand-400 bg-black/20 rounded-xl flex flex-col items-center justify-center transition-all cursor-pointer text-slate-400 hover:text-brand-300 group" onClick={captureScreen}>
                                                            <svg className="w-6 h-6 mb-1 opacity-50 group-hover:opacity-100 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" /></svg>
                                                            <span className="text-xs font-bold">Add Another</span>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* SUBMIT BUTTON */}
                                    <button onClick={handleSubmit} className="w-full font-bold py-3 sm:py-4 px-6 rounded-2xl shadow-xl transition-all duration-300 text-white mt-8 bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-400 hover:-translate-y-1 flex justify-center items-center gap-2">
                                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                                        Submit Enterprise Ticket
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- NEW LOAD SCREEN LOGIC + v1.1 BOOT PATCH ---
        try {
            window.__empowerReactRenderStarted = true;
            ReactDOM.createRoot(document.getElementById('root')).render(<StartupErrorBoundary><App /></StartupErrorBoundary>);
        } catch (e) {
            showStartupError(e);
        }
        window.addEventListener('load', () => {
            // Unmounts the custom loader exactly when React kicks in
            const oldRoot = document.getElementById('root');
            if(oldRoot && oldRoot.classList.contains('bg-slate-900')) {
                oldRoot.className = "";
            }
        });
    </script>
</body>
</html>
