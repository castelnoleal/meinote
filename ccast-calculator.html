<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSAT Recovery Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:auto}
body{
font-family:'Segoe UI',sans-serif;
background:transparent;
padding:8px;
color:white;
}
.card{
width:min(100%,420px);
margin:0 auto;
background:rgba(30,41,59,.96);
border-radius:16px;
padding:14px;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 8px 20px rgba(0,0,0,.25);
}
h1{font-size:1.1rem;text-align:center;color:#93c5fd;margin-bottom:4px}
.subtitle{font-size:.72rem;text-align:center;color:#94a3b8;margin-bottom:12px}
label{display:block;font-size:.78rem;margin:8px 0 4px;font-weight:600}
input{
width:100%;padding:10px;border:none;border-radius:10px;
background:#334155;color:#fff;font-size:.9rem;
}
.result{display:grid;gap:10px;margin-top:12px}
.resultCard{background:#111827;padding:12px;border-radius:12px}
.resultLabel{font-size:.65rem;color:#94a3b8;text-transform:uppercase}
.mainNumber{font-size:2rem;font-weight:800}
.metric{display:flex;justify-content:space-between;align-items:center}
.metricValue{font-size:1.2rem;font-weight:700}
.blue{color:#60a5fa}.green{color:#22c55e}.yellow{color:#facc15}.red{color:#ef4444}
.feedback{padding:12px;border-radius:10px;font-size:.85rem}
.pass{background:rgba(34,197,94,.15)}
.warn{background:rgba(250,204,21,.15)}
.fail{background:rgba(239,68,68,.15)}
</style>
</head>
<body>
<div class="card">
<h1>CSAT Recovery Calculator</h1>
<div class="subtitle">Compact widget for OneNote / iframe embeds</div>
<label>Total CSATs (5)</label>
<input id="ccsat" type="number" min="0">
<label>Total DSATs (1)</label>
<input id="dsat" type="number" min="0">
<label>Target Passing Score</label>
<input id="passscore" type="number" min="0" max="5" step="0.01" value="4.60">
<div class="result">
<div class="resultCard"><div class="resultLabel">Current Average</div><div id="average" class="mainNumber blue">0.00</div></div>
<div class="resultCard metric"><span>CSAT Needed</span><span id="needed" class="metricValue">0</span></div>
<div class="resultCard metric"><span>Total Surveys</span><span id="projected" class="metricValue">0</span></div>
<div id="feedback" class="feedback"><i>Enter survey data to begin</i></div>
</div>
</div>
<script>
const CONFIG={defaultPassingScore:4.6,outstandingOffset:.2,recoveryOffset:.2};
const el={ccsat:ccsat,dsat:dsat,passscore:passscore,average:average,needed:needed,projected:projected,feedback:feedback};
function thresholds(score){return{pass:score,outstanding:Math.min(5,score+CONFIG.outstandingOffset),recovery:Math.max(0,score-CONFIG.recoveryOffset)}}
function calculate(){const c=+el.ccsat.value||0,d=+el.dsat.value||0,p=+el.passscore.value||CONFIG.defaultPassingScore;const total=c+d;const avg=total?((c*5)+d)/total:0;el.average.textContent=avg.toFixed(2);let need=0;while(total>0&&((((c+need)*5)+d)/(total+need))<p)need++;el.needed.textContent=need;el.projected.textContent=total+need;updateFeedback(avg,total,p);resizeIframe();}
function updateFeedback(avg,total,p){if(!total){el.feedback.className='feedback';el.average.className='mainNumber blue';el.feedback.innerHTML='Enter survey data to begin';return;}const t=thresholds(p);if(avg>=t.outstanding){el.average.className='mainNumber green';el.feedback.className='feedback pass';el.feedback.innerHTML='🟢 Outstanding';}else if(avg>=t.pass){el.average.className='mainNumber green';el.feedback.className='feedback pass';el.feedback.innerHTML='✅ Passing';}else if(avg>=t.recovery){el.average.className='mainNumber yellow';el.feedback.className='feedback warn';el.feedback.innerHTML='🟡 Recovery Zone';}else{el.average.className='mainNumber red';el.feedback.className='feedback fail';el.feedback.innerHTML='🔴 Critical Risk';}}
function resizeIframe(){window.parent?.postMessage({type:'resize',height:document.documentElement.scrollHeight},'*');}
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',calculate));calculate();
</script>
</body>
</html>
