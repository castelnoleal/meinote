<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSAT Recovery Calculator</title>
<style>
*{box-sizing:border-box;}
html,body{width:100%;height:100%;margin:0;padding:0;}
body{
 font-family:"Segoe UI",sans-serif;
 background:radial-gradient(circle at top right,#2563eb,#0f172a 55%);
 color:white;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:1rem;
}
.card{
 width:min(100%,900px);
 background:rgba(30,41,59,.95);
 border-radius:24px;
 padding:clamp(16px,3vw,28px);
 border:1px solid rgba(255,255,255,.08);
 box-shadow:0 25px 50px rgba(0,0,0,.45);
}
h1{margin:0;text-align:center;color:#93c5fd;}
.subtitle{text-align:center;color:#94a3b8;margin-top:8px;margin-bottom:25px;}
label{display:block;margin-top:12px;margin-bottom:6px;font-weight:600;}
input{width:100%;padding:14px;border:none;border-radius:12px;background:#334155;color:white;font-size:16px;}
input:focus{outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.3);}
.result{margin-top:20px;display:grid;gap:15px;}
.resultCard{background:#111827;padding:16px;border-radius:16px;}
.resultLabel{color:#94a3b8;font-size:12px;text-transform:uppercase;}
.mainNumber{font-size:clamp(2rem,8vw,52px);font-weight:800;}
.metric{display:flex;justify-content:space-between;align-items:center;}
.metricValue{font-size:clamp(1.25rem,5vw,28px);font-weight:800;}
.blue{color:#60a5fa;}.green{color:#22c55e;}.yellow{color:#facc15;}.red{color:#ef4444;}
.feedback{padding:16px;border-radius:14px;line-height:1.5;}
.pass{background:rgba(34,197,94,.15);} .warn{background:rgba(250,204,21,.15);} .fail{background:rgba(239,68,68,.15);}
@media (max-width:480px){.card{border-radius:16px}.metric{flex-direction:column;align-items:flex-start;gap:8px}}
</style>
</head>
<body>
<div class="card">
<h1>CSAT Recovery Calculator</h1>
<div class="subtitle">5 = CSAT • 1 = DSAT • Passing Score = 4.60</div>
<label>Total CSATs (5)</label><input id="ccsat" type="number" min="0">
<label>Total DSATs (1)</label><input id="dsat" type="number" min="0">
<div class="result">
<div class="resultCard"><div class="resultLabel">Current Average CSAT</div><div id="average" class="mainNumber blue">0.00</div></div>
<div class="resultCard metric"><span>CSAT Needed</span><span id="needed" class="metricValue">0</span></div>
<div class="resultCard metric"><span>Projected Surveys in Total</span><span id="projected" class="metricValue">0</span></div>
<div id="feedback" class="feedback"><i>Enter survey data to begin</i></div>
</div></div>
<script>
const PASS_SCORE=4.60;
function calculate(){let ccsat=parseInt(document.getElementById('ccsat').value)||0;let dsat=parseInt(document.getElementById('dsat').value)||0;let total=ccsat+dsat;let average=0;if(total>0){average=((ccsat*5)+(dsat*1))/total;}updateAverage(average);calculateRecovery(ccsat,dsat,total,average);}
function updateAverage(a){document.getElementById('average').textContent=a.toFixed(2);}
function calculateRecovery(ccsat,dsat,total,average){let needed=0;while(total>0&&((((ccsat+needed)*5)+(dsat*1))/(total+needed))<PASS_SCORE){needed++;}document.getElementById('needed').textContent=needed;document.getElementById('projected').textContent=total+needed;updateFeedback(average,total);}
function updateFeedback(average,total){const avg=document.getElementById('average');const feedback=document.getElementById('feedback');if(total===0){avg.className='mainNumber blue';feedback.className='feedback';feedback.innerHTML='Enter survey data to begin.';return;} if(average>=4.80){avg.className='mainNumber green';feedback.className='feedback pass';feedback.innerHTML='🟢 Outstanding performance.';} else if(average>=PASS_SCORE){avg.className='mainNumber green';feedback.className='feedback pass';feedback.innerHTML='✅ Passing.';} else if(average>=4.40){avg.className='mainNumber yellow';feedback.className='feedback warn';feedback.innerHTML='🟡 Recovery Zone.';} else {avg.className='mainNumber red';feedback.className='feedback fail';feedback.innerHTML='🔴 Critical Risk.';}}
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',calculate));calculate();
function resizeIframe(){const height=document.documentElement.scrollHeight;window.parent.postMessage({type:'resize',height},'*');}
window.addEventListener('load',resizeIframe);window.addEventListener('resize',resizeIframe);
</script>
</body></html>
