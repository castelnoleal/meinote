   ===================================================== */

let currentCategory = 'CasTools';

function renderCategory(category){
  currentCategory = category;

  let groups = 0;
  let buttons = 0;
  let html = '';

  for(const groupName in DATA[category]){
    groups++;

    html += `<div class="group">
      <div class="group-title" onclick="toggleGroup(this)">${groupName}</div>
      <div class="group-content">`;

    DATA[category][groupName].forEach(item => {
      buttons++;
      html += `<a class="link-btn" href="${item.link}" target="_blank">${item.label}</a>`;
    });

    html += `</div></div>`;
  }

  pageTitle.textContent = category;
  stats.textContent = `${groups} Groups • ${buttons} Buttons`;
  content.innerHTML = html;
}

function toggleGroup(element){
  const panel = element.nextElementSibling;
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
}

function showCategory(category, button){
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  button.classList.add('active');
  renderCategory(category);
}

search.addEventListener('input', function(){
  const query = this.value.toLowerCase().trim();

  if(!query){
    renderCategory(currentCategory);
    return;
  }

  let results = '';

  for(const category in DATA){
    for(const group in DATA[category]){
      DATA[category][group].forEach(item => {
        if((category + group + item.label).toLowerCase().includes(query)){
          results += `<a class="link-btn" href="${item.link}" target="_blank">
            ${category} › ${group} › ${item.label}
          </a>`;
        }
      });
    }
  }

  pageTitle.textContent = 'Search Results';
  stats.textContent = '';
  content.innerHTML = results || '<p>No results found.</p>';
});

renderCategory('CasTools');
