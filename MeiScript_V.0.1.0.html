<meta charset="UTF-8">
<!-- Team pack: fills in private names, emails and internal links from this browser only -->
<script>
/* =====================================================================
   MeiNote · TEAM PACK (private details)
   The public files only contain placeholders like {{mgr_manila_email:Manila manager's email}}
   or {{link_07:#team-pack}}. The real names, emails and internal links are
   in a private "team pack" file that each person loads once. It is kept in
   that browser only (localStorage) and is never sent anywhere.

   Placeholder:  {{key:shown when no team pack is loaded}}
   ===================================================================== */
(function(){
"use strict";
var KEY = "meinote.teampack.v1";
var TOKEN = /\{\{([a-z0-9_]+)(?::([^{}]*))?\}\}/g;
var HAS = /\{\{[a-z0-9_]+(?::[^{}]*)?\}\}/;
var NEED = "#team-pack";

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return null; } }
var pack = load();
var values = (pack && pack.values) || {};

function fill(s){
  if(s == null) return s;
  return String(s).replace(TOKEN, function(m, k, fb){
    if(Object.prototype.hasOwnProperty.call(values, k)) return values[k];
    return fb != null ? fb : "[" + k + "]";
  });
}

/* ---------- Fill placeholders in the page ---------- */
var ATTRS = ["href", "src", "value", "title", "placeholder", "onclick", "data-link"];
function fillNode(n){
  if(n.nodeType === 3){ if(HAS.test(n.nodeValue)) n.nodeValue = fill(n.nodeValue); return; }
  if(n.nodeType !== 1 || n.tagName === "SCRIPT" || n.tagName === "STYLE") return;
  ATTRS.forEach(function(a){ var v = n.getAttribute(a); if(v && HAS.test(v)) n.setAttribute(a, fill(v)); });
  if((n.tagName === "TEXTAREA" || n.tagName === "INPUT") && HAS.test(n.value)) n.value = fill(n.value);
  for(var c = n.firstChild; c; c = c.nextSibling) fillNode(c);
}
new MutationObserver(function(list){
  list.forEach(function(m){
    if(m.type === "characterData") fillNode(m.target);
    else if(m.type === "attributes") fillNode(m.target);
    else m.addedNodes.forEach(fillNode);
  });
}).observe(document.documentElement, {childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTRS});
document.addEventListener("DOMContentLoaded", function(){ fillNode(document.documentElement); });

/* Links opened by code */
var openWin = window.open;
window.open = function(url){
  var u = fill(url);
  if(u === NEED || (typeof u === "string" && u.indexOf(NEED) === 0)){ needPack(); return null; }
  var args = [].slice.call(arguments); args[0] = u;
  return openWin.apply(window, args);
};
document.addEventListener("click", function(e){
  var a = e.target.closest && e.target.closest("a[href]");
  if(a && a.getAttribute("href").indexOf(NEED) === 0){ e.preventDefault(); needPack(); }
}, true);

/* ---------- Team pack window ---------- */
function box(){
  var old = document.getElementById("meiTeamPack"); if(old) old.remove();
  var d = document.createElement("div");
  d.id = "meiTeamPack";
  d.setAttribute("style", "position:fixed;inset:0;z-index:2147483000;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;font-family:Inter,'Segoe UI',system-ui,sans-serif");
  d.addEventListener("click", function(e){ if(e.target === d) d.remove(); });
  document.body.appendChild(d);
  return d;
}
function card(inner){
  return '<div style="background:#fff;color:#0f172a;border-radius:18px;max-width:440px;width:100%;overflow:hidden;box-shadow:0 25px 60px rgba(15,23,42,.35)">' +
    '<div style="background:linear-gradient(135deg,#0f172a,#2563eb);color:#fff;padding:12px 16px;font-weight:600;display:flex;justify-content:space-between">Team pack<button type="button" data-x style="background:none;border:0;color:#fca5a5;font-size:18px;cursor:pointer">✕</button></div>' +
    '<div style="padding:16px;font-size:14px;line-height:1.5">' + inner + '</div></div>';
}
var BTN = "border-radius:12px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:14px;";
function manager(note){
  var d = box(), n = Object.keys(values).length;
  d.innerHTML = card(
    (note ? '<p style="margin:0 0 10px;color:#b45309;font-weight:600">' + note + '</p>' : "") +
    '<p style="margin:0 0 10px">The team pack adds the private details MeiNote needs: coworker names and emails in request notes, and internal KB and form links. It stays in this browser on this computer and is never uploaded.</p>' +
    '<p style="margin:0 0 14px;color:#475569">' + (n ? "Loaded: <b>" + n + " details</b>" + (pack && pack.updated ? ", updated " + String(pack.updated).slice(0, 10) : "") + "." : "No team pack loaded on this computer.") + '</p>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><label style="' + BTN + 'background:#1d4ed8;color:#fff">Load team pack file<input type="file" accept=".json,application/json" hidden></label>' +
    (n ? '<button type="button" data-rm style="' + BTN + 'background:#fff;border:1px solid #cbd5e1;color:#dc2626">Remove from this computer</button>' : "") + '</div>' +
    '<p data-msg style="margin:10px 0 0;font-size:13px"></p>');
  d.querySelector("[data-x]").onclick = function(){ d.remove(); };
  var rm = d.querySelector("[data-rm]");
  if(rm) rm.onclick = function(){ try{ localStorage.removeItem(KEY); }catch(e){} location.reload(); };
  d.querySelector("input[type=file]").addEventListener("change", function(){
    var f = this.files[0], msg = d.querySelector("[data-msg]"); if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var p = JSON.parse(r.result);
        if(!p || !p.meinote_team_pack || typeof p.values !== "object") throw new Error();
        localStorage.setItem(KEY, JSON.stringify(p));
        msg.style.color = "#15803d"; msg.textContent = "Team pack loaded. Reloading...";
        setTimeout(function(){ location.reload(); }, 600);
      }catch(e){ msg.style.color = "#dc2626"; msg.textContent = "That file isn't a MeiNote team pack."; }
    };
    r.readAsText(f);
  });
}
function needPack(){ manager(Object.keys(values).length ? "This link isn't in your team pack. Ask for the latest team pack." : "This link is private. Load the team pack to open it."); }

window.MeiPrivate = {fill: fill, has: function(s){ return HAS.test(s || ""); }, loaded: function(){ return Object.keys(values).length > 0; }, open: function(){ manager(); }, key: KEY};
})();
</script>

function renderNav(){
  var h='<button class="nav" data-v="Pinned" aria-current="'+(view==="Pinned")+'"><span class="ic">⭐</span>Pinned<span class="ct">'+pins.length+'</span></button>'+
        '<button class="nav" data-v="Recent" aria-current="'+(view==="Recent")+'"><span class="ic">🕘</span>Recently opened<span class="ct">'+recent.length+'</span></button><div class="sep"></div>';
  Object.keys(DATA).forEach(function(c){var n=ALL.filter(function(x){return x.cat===c}).length;h+='<button class="nav" data-v="'+c+'" aria-current="'+(view===c)+'"><span class="ic">'+(ICONS[c]||"•")+'</span>'+c+'<span class="ct">'+n+'</span></button>';});
  document.getElementById("nav").innerHTML=h;
}
function render(){
  var q=document.getElementById("q").value.trim().toLowerCase(), out="", title=view, stats="";
  if(q){
    var res=ALL.filter(function(x){return (x.label+" "+x.group+" "+x.cat).toLowerCase().indexOf(q)>=0});
    title="Search results"; stats=res.length+" match"+(res.length===1?"":"es")+' for “'+esc(q)+'”';
    out=res.length?'<section class="group"><div class="links">'+res.map(function(i){return row(i,q,true)}).join("")+'</div></section>':'<div class="empty">Nothing matches “'+esc(q)+'”. Try a shorter word, like “NSF” or “credit”.</div>';
  }else if(view==="Pinned"){
    var p=pins.map(byKey).filter(Boolean); stats="Your most-used links, kept on this computer.";
    out=p.length?'<section class="group"><div class="links">'+p.map(function(i){return row(i,"",true)}).join("")+'</div></section>':'<div class="empty">Pin a link with the star and it shows up here for one-click access.</div>';
  }else if(view==="Recent"){
    var r=recent.map(byKey).filter(Boolean); stats="The last links you opened.";
    out=r.length?'<section class="group"><div class="links">'+r.map(function(i){return row(i,"",true)}).join("")+'</div></section>':'<div class="empty">Links you open will be listed here.</div>';
  }else{
    var groups=Object.keys(DATA[view]); var n=0;
    groups.forEach(function(g){var items=ALL.filter(function(x){return x.cat===view&&x.group===g});n+=items.length;out+=group(g,items,view+"|"+g,false);});
    stats=groups.length+" groups · "+n+" links";
  }
  document.getElementById("title").textContent=title;
  document.getElementById("stats").innerHTML=stats;
  document.getElementById("content").innerHTML=out;
  document.getElementById("toggleAll").style.visibility=(q||view==="Pinned"||view==="Recent")?"hidden":"visible";
  var anyOpen=document.querySelector(".group:not(.closed) .ghead");
  document.getElementById("toggleAll").textContent=anyOpen?"Collapse all":"Expand all";
  renderNav();
}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show")},1600);}
document.getElementById("nav").addEventListener("click",function(e){var b=e.target.closest("[data-v]");if(!b)return;view=b.dataset.v;document.getElementById("q").value="";render();});
document.getElementById("content").addEventListener("click",function(e){
  var g=e.target.closest(".ghead");
  if(g){var s=g.parentNode,id=s.dataset.g;s.classList.toggle("closed");closed[id]=s.classList.contains("closed");g.setAttribute("aria-expanded",!closed[id]);LS.set("meiscript.closed",closed);return;}
  var pb=e.target.closest("[data-pin]");
  if(pb){var k=pb.dataset.pin,i=pins.indexOf(k);if(i>=0)pins.splice(i,1);else pins.unshift(k);LS.set("meiscript.pins",pins);toast(i>=0?"Unpinned":"Pinned to top");render();return;}
  var cb=e.target.closest("[data-copy]");
  if(cb){var it=byKey(cb.dataset.copy);navigator.clipboard&&navigator.clipboard.writeText(window.MeiPrivate?MeiPrivate.fill(it.link):it.link).then(function(){toast("Link copied")},function(){toast("Copy blocked by the browser")});return;}
  var a=e.target.closest("a[data-k]");
  if(a&&a.getAttribute("aria-disabled")!=="true"){var key=a.dataset.k;recent=[key].concat(recent.filter(function(x){return x!==key})).slice(0,10);LS.set("meiscript.recent",recent);setTimeout(renderNav,50);}
});
document.getElementById("toggleAll").onclick=function(){
  var collapse=this.textContent==="Collapse all";
  Object.keys(DATA[view]).forEach(function(g){closed[view+"|"+g]=collapse});LS.set("meiscript.closed",closed);render();
};
var qEl=document.getElementById("q");
qEl.addEventListener("input",render);
qEl.addEventListener("keydown",function(e){if(e.key==="Enter"){var a=document.querySelector("#content a[data-k]:not([aria-disabled])");if(a)a.click();}if(e.key==="Escape"){qEl.value="";render();}});
document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement!==qEl){e.preventDefault();qEl.focus();}});
/* Follow MeiNote's night mode when opened inside it */
function syncTheme(){var dark=false;try{dark=window.parent!==window&&window.parent.document.documentElement.classList.contains("dark")}catch(e){}if(window.parent===window)dark=matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.classList.toggle("dark",dark);}
syncTheme();setInterval(syncTheme,1500);
render();
</script>
</body>
</html>
